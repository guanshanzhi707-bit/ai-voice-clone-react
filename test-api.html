<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API连接测试</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }
        .test-button {
            background: #5e7ce6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px 0;
        }
        .result {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            white-space: pre-wrap;
        }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
    </style>
</head>
<body>
    <h1>API连接测试</h1>
    <p>当前访问地址: <span id="currentUrl"></span></p>

    <button class="test-button" onclick="testHealthCheck()">测试健康检查</button>
    <button class="test-button" onclick="testCORS()">测试CORS</button>

    <div id="results"></div>

    <script>
        document.getElementById('currentUrl').textContent = window.location.href;

        function addResult(message, isSuccess = true) {
            const resultsDiv = document.getElementById('results');
            const resultDiv = document.createElement('div');
            resultDiv.className = `result ${isSuccess ? 'success' : 'error'}`;
            resultDiv.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            resultsDiv.appendChild(resultDiv);
        }

        async function testHealthCheck() {
            try {
                const response = await fetch('http://192.168.0.160:3001/health');
                const data = await response.json();
                addResult(`健康检查成功: ${JSON.stringify(data, null, 2)}`, true);
            } catch (error) {
                addResult(`健康检查失败: ${error.message}`, false);
            }
        }

        async function testCORS() {
            try {
                const response = await fetch('http://192.168.0.160:3001/health', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    }
                });
                const data = await response.json();
                addResult(`CORS测试成功: ${JSON.stringify(data, null, 2)}`, true);
            } catch (error) {
                addResult(`CORS测试失败: ${error.message}`, false);
            }
        }

        // 自动运行测试
        window.onload = function() {
            addResult('页面加载完成，开始自动测试...');
            setTimeout(testHealthCheck, 1000);
            setTimeout(testCORS, 2000);
        };
    </script>
</body>
</html>
